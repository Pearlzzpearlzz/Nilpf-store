<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Participant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      padding: 40px 20px 90px;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #d4af37;
      font-size: 28px;
      margin: 0 0 24px;
      letter-spacing: 1px;
    }
    .card {
      background: #050505;
      border: 1px solid #d4af37;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 0 24px rgba(212,175,55,.22);
    }
    input[type="text"], select {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border-radius: 12px;
      border: 1px solid #666;
      background: #0b0b0b;
      color: #fff;
      margin-bottom: 18px;
    }
    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      border: 0;
      border-radius: 12px;
      background: #d4af37;
      color: #000;
      cursor: pointer;
    }
    h2 {
      margin: 28px 0 12px;
      color: #d4af37;
      font-size: 22px;
    }
    .list {
      margin: 0;
      padding-left: 22px;
    }
    .list li {
      font-size: 18px;
      margin: 10px 0;
    }
    .empty {
      color: #bbb;
      font-size: 17px;
      margin-top: 8px;
    }
    .footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      text-align: center;
      background: #fff;
      color: #000;
      border-top: 2px solid #000;
      padding: 10px 0;
      font-size: 14px;
      z-index: 99999;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;"><h1 style="margin:0;">ADD PARTICIPANT</h1><a href="/" style="background:#d4af37;color:#000;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:700;">Dashboard</a></div>

    <div class="card">
      <form method="POST">
        <input type="text" name="name" placeholder="Participant Name" required>
          <div style="border:1px solid #d4af37;border-radius:12px;padding:14px;margin-bottom:18px;color:#d4af37;font-weight:700;text-align:center;">
            Housing type is selected on the Dashboard before adding the participant.
          </div>

<button type="submit">Add Participant</button>
      </form>

      <h2>Participants</h2>

      {% if participants %}
        <ul class="list">
          {% for p in participants %}
            <li>{{ p.name }}</li>
          {% endfor %}
        </ul>
      {% else %}
        <div class="empty">No participants added yet.</div>
      {% endif %}
    </div>
  </div>

  <div class="footer">NILPF-OS 2026</div>
</body>
</html>
