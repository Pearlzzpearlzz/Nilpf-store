<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>House Rules - Review</title>

<style>
  .print-now-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 9999;
    background: #d4af37;
    color: #000;
    border: 1px solid #8a680f;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  @media print {
    .print-now-btn {
      display: none !important;
    }
  }
</style>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile_responsive.css') }}">
</head>
<body>
<button class="print-now-btn" type="button" onclick="window.print()">Print This Form</button>

{% set review_mode = True %}
{% include "house_rules_form.html" %}

<hr>

<div class="review-actions" style="margin-top:25px; padding-top:15px; border-top:2px solid #ccc;">

{% if locked %}
<p><strong>FINAL LOCKED DOCUMENT</strong></p>
<p><a href="/fire-safety/{{ id }}">Continue to Next Form</a></p>

{% else %}
<p><a href="/house-rules-unlock/{{ id }}">Edit</a></p>

<form method="POST" action="/house-rules-final/{{ id }}" onsubmit="return disableFinalLock(this)">
    <button type="submit">Final Lock</button>
</form>
{% endif %}

</div>

<script>
{% if locked %}
document.querySelectorAll("input, textarea, select").forEach(el => {
    el.setAttribute("readonly","readonly");
    el.setAttribute("disabled","disabled");
});
{% endif %}
</script>


<script>
function disableFinalLock(formOrButton) {
  const btn = formOrButton.querySelector ? formOrButton.querySelector('button[type="submit"]') : formOrButton;
  if (btn) {
    if (btn.dataset.locking === "1") {
      return false;
    }
    btn.dataset.locking = "1";
    btn.disabled = true;
    btn.innerText = "Locking...";
  }
  return true;
}

function disableFinalLockLink(link) {
  if (link.dataset.locking === "1") {
    return false;
  }
  link.dataset.locking = "1";
  link.style.pointerEvents = "none";
  link.innerText = "Locking...";
  return true;
}
</script>

</body>
</html>
