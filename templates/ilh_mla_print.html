<!DOCTYPE html>
<html>
<head>
<style>
body > form[action*="/{{ id }}"]:not([action*="final"]) { display:none; }
</style><title>ILH MLA Review</title>
<style>
  .print-now-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 9999;
    background: #d4af37;
    color: #000;
    border: 1px solid #8a680f;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  @media print {
    .print-now-btn {
      display: none !important;
    }
  }
</style>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile_responsive.css') }}">

<style>
.nilpf-safe-nav{
  position:sticky;
  top:0;
  z-index:9999;
  display:flex;
  justify-content:center;
  padding:10px;
  background:#050505;
  border-bottom:2px solid #D4AF37;
}
.nilpf-safe-nav a{
  display:inline-block;
  padding:10px 14px;
  border-radius:8px;
  background:#D4AF37;
  color:#000 !important;
  font-weight:bold;
  text-decoration:none;
  font-family:Arial,sans-serif;
  font-size:14px;
}
@media print{
  .nilpf-safe-nav{display:none !important;}
}
</style>

</head>
<body>

<div class="nilpf-safe-nav">
  <a href="/operations">Exit to Operations</a>
</div>

<button class="print-now-btn" type="button" onclick="window.print()">Print This Form</button>
{% include "ilh_mla_form.html" %}
<hr>
{% if locked %}
{% if locked %}<p><strong>FINAL LOCKED DOCUMENT</strong></p>{% endif %}
{% else %}
<form method="POST" action="/ilh-mla-final/{{ id }}" onsubmit="return disableFinalLock(this)">
<button type="submit">Lock</button>
</form>

{% endif %}

<script>
{% if locked %}
document.querySelectorAll("input, textarea, select").forEach(el => {
    el.setAttribute("readonly","readonly");
    el.setAttribute("disabled","disabled");
});
{% endif %}
</script>

<hr>
{% if not locked %}
<a href="/ilh-mla-unlock/{{ id }}">Edit / Unlock</a>
<br><br>
<form method="POST" action="/ilh-mla-final/{{ id }}" onsubmit="return disableFinalLock(this)">
<button type="submit">Finalize and Lock</button>
</form>
{% else %}
<p><strong>FINAL LOCKED DOCUMENT</strong></p>
{% endif %}


<script>
function disableFinalLock(formOrButton) {
  const btn = formOrButton.querySelector ? formOrButton.querySelector('button[type="submit"]') : formOrButton;
  if (btn) {
    if (btn.dataset.locking === "1") {
      return false;
    }
    btn.dataset.locking = "1";
    btn.disabled = true;
    btn.innerText = "Locking...";
  }
  return true;
}

function disableFinalLockLink(link) {
  if (link.dataset.locking === "1") {
    return false;
  }
  link.dataset.locking = "1";
  link.style.pointerEvents = "none";
  link.innerText = "Locking...";
  return true;
}
</script>

</body>
</html>


<hr>
