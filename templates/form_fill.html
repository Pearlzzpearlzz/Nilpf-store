<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111;
      margin: 0;
      padding: 24px;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 10px;
    }
    .box {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    .btns {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      background: #111;
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    .btn.light {
      background: #e9e9e9;
      color: #111;
      border: 1px solid #bbb;
    }
    .meta {
      margin-top: 10px;
      color: #444;
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile_responsive.css') }}">
</head>
<body>
  <div class="wrap">
    <h1>Fill Form</h1>
    <div class="meta"><strong>Participant:</strong> {{ participant.name }}</div>
    <div class="meta"><strong>Form:</strong> {{ doc.title }}</div>
    <div class="meta"><strong>PDF File:</strong> {{ doc.file }}</div>

    <div class="box">
      <form method="POST">
        <label for="printed_name">Printed Name</label>
        <input type="text" id="printed_name" name="printed_name" value="{{ saved.get('printed_name', participant.name) }}">

        <label for="participant_signature">Participant Signature</label>
        <input type="text" id="participant_signature" name="participant_signature" value="{{ saved.get('participant_signature', participant.name) }}">

        <label for="signature_date">Signature Date</label>
        <input type="date" id="signature_date" name="signature_date" value="{{ saved.get('signature_date', '') }}">

        <label for="notes">Form Notes</label>
        <textarea id="notes" name="notes">{{ saved.get('notes', '') }}</textarea>

        <div class="btns">
          <button class="btn" type="submit">Save This Form</button>
          <a class="btn light" href="{{ url_for('static', filename='forms/' + doc.file) }}" target="_blank">Open Blank PDF</a>
          <a class="btn light" href="{{ url_for('packet_builder', id=participant_id) }}">Back to Packet Builder</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
