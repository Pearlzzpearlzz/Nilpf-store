<!DOCTYPE html>
<html>
<head>
<style>
body > form[action*="/{{ id }}"]:not([action*="final"]) { display:none; }

.footer-watermark{
    position:fixed;
    bottom:8px;
    left:0;
    width:100%;
    text-align:center;
    font-size:11px;
    color:#777;
    opacity:0.65;
    pointer-events:none;
}

</style>
    <title>Program Participation Agreement - Review</title>

<style>
  .print-now-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 9999;
    background: #d4af37;
    color: #000;
    border: 1px solid #8a680f;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  @media print {
    .print-now-btn {
      display: none !important;
    }
  }
</style>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile_responsive.css') }}">
</head>
<body>
<button class="print-now-btn" type="button" onclick="window.print()">Print This Form</button>

<h2>PROGRAM PARTICIPATION AGREEMENT</h2>

{% include "program_participation_agreement_form.html" %}

<hr>

{% if locked %}
{% if locked %}<p><strong>FINAL LOCKED DOCUMENT</strong></p>{% endif %}
{% else %}

<br><br>

<hr>
<div class="print-actions" style="margin-top:30px; padding:15px; border-top:2px solid #ccc;">
    {% if not locked %}
    <form method="POST" action="/program-participation-agreement-final/{{ id }}" style="display:inline;">
        <button type="submit">Final Lock</button>
    </form>
    {% else %}
    <p><strong>FINAL LOCKED DOCUMENT</strong></p>
    <form method="POST" action="/program-participation-agreement-unlock/{{ id }}" style="display:inline;">
        <button type="submit">Edit / Unlock</button>
    </form>
    {% endif %}

    <p style="margin-top:20px;">
        
    </p>
</div>

{% endif %}
