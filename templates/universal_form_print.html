<!DOCTYPE html>
<html>
<head>
<style>
body > form[action*="/{{ id }}"]:not([action*="final"]) { display:none; }
</style>
    <title>Form Review</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile_responsive.css') }}">

<style>
.nilpf-safe-nav{
  position:sticky;
  top:0;
  z-index:9999;
  display:flex;
  justify-content:center;
  padding:10px;
  background:#050505;
  border-bottom:2px solid #D4AF37;
}
.nilpf-safe-nav a{
  display:inline-block;
  padding:10px 14px;
  border-radius:8px;
  background:#D4AF37;
  color:#000 !important;
  font-weight:bold;
  text-decoration:none;
  font-family:Arial,sans-serif;
  font-size:14px;
}
@media print{
  .nilpf-safe-nav{display:none !important;}
}
</style>

</head>
<body>

<div class="nilpf-safe-nav">
  <a href="/operations">Exit to Operations</a>
</div>


<h2>Saved Form Review</h2>

{% include form_key + ".html" %}

<br><br>
<hr>

{% if locked %}
{% if locked %}<p><strong>{% if locked %}FINAL LOCKED DOCUMENT{% endif %}</strong></p>{% endif %}
{% else %}
<form method="POST" action="/form/{{ id }}/{{ form_key }}/lock">
    <button type="submit">Save and Lock (Final)</button>
</form>
{% endif %}

<br><br>



<form method="POST" action="/universal-form-final/{{ id }}" onsubmit="return disableFinalLock(this)">
<button type="submit">Lock</button>
</form>

<script>
{% if locked %}
document.querySelectorAll("input, textarea, select").forEach(el => {
    el.setAttribute("readonly","readonly");
    el.setAttribute("disabled","disabled");
});
{% endif %}
</script>

<script>
function disableFinalLock(formOrButton) {
  const btn = formOrButton.querySelector ? formOrButton.querySelector('button[type="submit"]') : formOrButton;
  if (btn) {
    if (btn.dataset.locking === "1") {
      return false;
    }
    btn.dataset.locking = "1";
    btn.disabled = true;
    btn.innerText = "Locking...";
  }
  return true;
}

function disableFinalLockLink(link) {
  if (link.dataset.locking === "1") {
    return false;
  }
  link.dataset.locking = "1";
  link.style.pointerEvents = "none";
  link.innerText = "Locking...";
  return true;
}
</script>

</body>
</html>
