<!DOCTYPE html>
<html>
<head>
  <title>Forms Complete</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #f5f5f5;
      text-align: center;
      padding: 40px 20px;
    }
    .box {
      max-width: 720px;
      margin: 60px auto;
      border: 2px solid #d4af37;
      border-radius: 14px;
      padding: 32px;
      background: #111;
    }
    h1 {
      color: #d4af37;
      font-size: 34px;
    }
    p {
      font-size: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Forms Complete</h1>
    <p>The participant form sequence is complete.</p>
    <p>Please return the device to program staff.</p>

    <div class="staff-options">
      <h2>Staff Options</h2>

      <form method="GET" action="/download-packet/{{ id }}" style="margin:12px auto;">
        <button type="submit" style="display:block; width:340px; max-width:90%; margin:auto; padding:14px 20px; text-align:center; background:#d4af37; color:#000; border:1px solid #8a680f; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer;">
          Print Current Participant Packet
        </button>
      </form>

      <form method="GET" action="/operations" style="margin:12px auto;">
        <button type="submit" style="display:block; width:340px; max-width:90%; margin:auto; padding:14px 20px; text-align:center; background:#111; color:#d4af37; border:1px solid #d4af37; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer;">
          Exit to Operations
        </button>
      </form>
    </div>

  </div>

    <div style="margin-top:24px; display:flex; flex-direction:column; gap:12px; align-items:center;">
</div>

</body>
</html>
