<!DOCTYPE html>
<html>
<head>
  <title>Forms Complete</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #f5f5f5;
      text-align: center;
      padding: 40px 20px;
    }
    .box {
      max-width: 720px;
      margin: 60px auto;
      border: 2px solid #d4af37;
      border-radius: 14px;
      padding: 32px;
      background: #111;
    }
    h1 {
      color: #d4af37;
      font-size: 34px;
    }
    p {
      font-size: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Forms Complete</h1>
    <p>The participant form sequence is complete.</p>
    <p>Please return the device to program staff.</p>

    <div class="staff-options">
      <h2>Staff Options</h2>

      <a class="btn gold" href="/download-packet/{{ id }}" style="display:block; width:300px; max-width:90%; margin:12px auto; padding:14px 20px; text-align:center; background:#d4af37; color:#000; border-radius:10px; text-decoration:none; font-weight:bold;">
        Print Current Participant Packet
      </a>

      <a class="btn dark" href="/operations" style="display:block; width:300px; max-width:90%; margin:12px auto; padding:14px 20px; text-align:center; background:#111; color:#d4af37; border-radius:10px; text-decoration:none; font-weight:bold;">
        Exit to Operations
      </a>
    </div>

  </div>

    <div style="margin-top:24px; display:flex; flex-direction:column; gap:12px; align-items:center;">
</div>

</body>
</html>
