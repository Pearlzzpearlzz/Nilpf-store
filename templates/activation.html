<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Activate NILPF</title>
<style>
body { background:#000;color:#fff;font-family:Arial;text-align:center;padding:40px;}
input { width:280px;padding:12px;margin:8px;border-radius:8px;border:1px solid #d4af37;background:#111;color:#fff;}
button { padding:12px 20px;background:#d4af37;border:none;border-radius:10px;font-weight:bold;}
</style>
</head>
<body>

<h2>Activate Your System</h2>

<form method="POST">
<input name="email" placeholder="Email"><br>
<input name="property_name" placeholder="Property Name"><br>
<input name="license_number" placeholder="License Number"><br>
<input type="password" name="password" placeholder="Create Password"><br>
<input type="password" name="confirm_password" placeholder="Confirm Password"><br>
<button>Activate</button>
</form>

</body>
</html>
