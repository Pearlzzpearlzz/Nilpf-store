<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activate NILPF</title>
<style>
* { box-sizing: border-box; }

body {
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  text-align:center;
  padding:40px 16px;
  margin:0;
  overflow-x:hidden;
}

h2 {
  color:#d4af37;
  font-size:30px;
  margin:28px 0 22px;
}

form {
  width:100%;
  max-width:390px;
  margin:0 auto;
  padding:24px 18px;
  border:2px solid #d4af37;
  border-radius:18px;
  background:#050505;
  box-shadow:0 0 22px rgba(212,175,55,.22);
}

input {
  width:100%;
  padding:14px 12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #d4af37;
  background:#111;
  color:#fff;
  font-size:16px;
  min-height:50px;
}

button {
  width:100%;
  margin-top:14px;
  padding:15px 16px;
  background:#d4af37;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:17px;
  color:#000;
}

@media (max-width: 520px) {
  body {
    padding:18px 10px 34px;
  }

  h2 {
    font-size:28px;
    line-height:1.08;
    margin:24px 0 18px;
  }

  form {
    max-width:390px;
    padding:22px 14px;
  }
}
</style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile_responsive.css') }}">

<style>
.nilpf-safe-nav{
  position:sticky;
  top:0;
  z-index:9999;
  display:flex;
  justify-content:center;
  padding:10px;
  background:#050505;
  border-bottom:2px solid #D4AF37;
}
.nilpf-safe-nav a{
  display:inline-block;
  padding:10px 14px;
  border-radius:8px;
  background:#D4AF37;
  color:#000 !important;
  font-weight:bold;
  text-decoration:none;
  font-family:Arial,sans-serif;
  font-size:14px;
}
@media print{
  .nilpf-safe-nav{display:none !important;}
}
</style>

</head>
<body>

<div class="nilpf-safe-nav">
  <a href="/operations">Exit to Operations</a>
</div>


<h2>Activate Your System</h2>

<form method="POST">
<input name="email" placeholder="Email"><br>
<input name="property_name" placeholder="Property Name"><br>
<input name="license_number" placeholder="License Number"><br>
<input type="password" name="password" placeholder="Create Password"><br>
<input type="password" name="confirm_password" placeholder="Confirm Password"><br>
<button>Activate</button>
</form>

</body>
</html>
