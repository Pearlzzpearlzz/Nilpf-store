<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Single Form Print Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, rgba(212,175,55,0.16), transparent 35%),
        linear-gradient(180deg, #ffffff 0%, #f8f8f8 100%);
      color: #111;
      padding: 12px;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      color: #d4af37;
      font-size: clamp(24px, 4vw, 36px);
      margin: 0 0 10px;
      letter-spacing: 2px;
      text-shadow: 0 2px 0 #7a5a08, 0 5px 15px rgba(0,0,0,0.22);
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .panel {
      background: linear-gradient(180deg, #171717, #050505);
      border: 2px solid #d4af37;
      border-radius: 14px;
      padding: 10px;
      color: #fff;
      box-shadow:
        0 0 0 2px #8a680f,
        0 8px 18px rgba(0,0,0,0.20),
        inset 0 0 24px rgba(212,175,55,0.10);
      text-align: left;
    }

    label {
      display: block;
      color: #f2cf5a;
      font-size: 17px;
      font-weight: 900;
      margin: 10px 0 6px;
    }

    select {
      width: 100%;
      padding: 9px;
      font-size: 14px;
      border-radius: 10px;
      border: 2px solid #d4af37;
      background: #fff;
      color: #111;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(212,175,55,0.12);
      border: 1px solid rgba(212,175,55,0.55);
      color: #fff;
      font-size: 14px;
      line-height: 1.35;
    }

      .button-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(180px, 1fr));
        gap: 10px;
        margin-top: 14px;
        justify-content: center;
      }

    .button {
      display: inline-block;
      text-decoration: none;
      color: #050505;
      background: linear-gradient(180deg, #f4d55f, #d4af37);
      border: 2px solid #b88d1b;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 16px;
      font-weight: 900;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 6px 12px rgba(0,0,0,0.25);
      cursor: pointer;
    }

    .button.secondary {
      background: #111;
      color: #d4af37;
      border-color: #d4af37;
    }

    .button.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .footer {
      text-align: center;
      color: #d4af37;
      margin-top: 14px;
      font-size: 14px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Single Form Print Center</h1>
    <div class="subtitle">Choose a participant, choose a form, then open the saved review/print copy.</div>

    <section class="panel">
      <label for="participantSelect">Select Participant</label>
      <select id="participantSelect">
        <option value="">-- Choose Participant --</option>
        {% for person in participants %}
          <option value="{{ loop.index0 }}">
            PID {{ loop.index0 }} - {{ person.name or "Unnamed Participant" }} - {{ person.program_type or "No Program" }}
          </option>
        {% endfor %}
      </select>

      <label for="formSelect">Select Form</label>
      <select id="formSelect">
        <option value="">-- Choose Form --</option>
        {% for form in single_form_routes %}
          <option value="{{ form.print_route }}" data-key="{{ form.key }}">
            {{ form.title }}
          </option>
        {% endfor %}
      </select>

      <div class="status" id="statusBox">
        Select a participant and a form. If the form was completed for that participant, open the review/print copy.
      </div>

      <div class="button-row">
        <a class="button disabled" id="openButton" href="#">Open Print Copy</a>
          <a class="button disabled" id="packetButton" href="#">Open Packet Builder</a>
        <a class="button secondary" href="/operations">Back to Operations</a>
        <a class="button secondary" href="/">Back to Dashboard</a>
      </div>
    </section>

    <div class="footer">NILPF-OS 2026</div>
  </main>

  <script>
    const participants = {{ participants|tojson }};
    const participantSelect = document.getElementById("participantSelect");
    const formSelect = document.getElementById("formSelect");
    const openButton = document.getElementById("openButton");
      const packetButton = document.getElementById("packetButton");
    const statusBox = document.getElementById("statusBox");

    function refreshLink() {
      const pid = participantSelect.value;
      const route = formSelect.value;
      const selectedOption = formSelect.options[formSelect.selectedIndex];
      const formKey = selectedOption ? selectedOption.getAttribute("data-key") : "";

      openButton.classList.add("disabled");
      openButton.href = "#";
        packetButton.classList.add("disabled");
        packetButton.href = "#";

        if (!pid) {
          statusBox.textContent = "Select a participant.";
          return;
        }

        packetButton.href = "/packet-builder/" + pid;
        packetButton.classList.remove("disabled");

        if (!route || !formKey) {
          statusBox.textContent = "Select a form, or open Packet Builder for this participant.";
          return;
        }
      const person = participants[parseInt(pid, 10)] || {};
      const forms = person.forms || {};
      const savedForm = forms[formKey];

      if (!savedForm) {
        statusBox.textContent = "This form has not been completed for this participant yet.";
        return;
      }

      const finalRoute = route.replace("{id}", pid);
      openButton.href = finalRoute;
      openButton.classList.remove("disabled");

      statusBox.textContent = "Ready: open the saved review/print copy for this participant.";
    }

    participantSelect.addEventListener("change", refreshLink);
    formSelect.addEventListener("change", refreshLink);
  </script>
</body>
</html>
