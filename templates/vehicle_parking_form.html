<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Parking Rules</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile_responsive.css') }}">
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: auto; padding: 30px; line-height: 1.5; }
    h1, h2 { text-align: center; }
    .box { border: 1px solid #000; padding: 16px; margin: 16px 0; }
    label { display: block; margin: 10px 0; }
    input[type="text"], input[type="date"] { width: 100%; padding: 8px; box-sizing: border-box; }
    .button { padding: 12px 18px; background: #000; color: #fff; border: 0; }
  </style>
</head>
<body>

<h1>Vehicle Parking Rules</h1>
<h2>Shared Housing Program</h2>

<form method="POST">

<div class="box">
  <h3>Participant Information</h3>

  <label>Participant Name
    <input type="text" name="participant_name" value="{{ d.get('participant_name') or participant.get('name', '') }}" required>
  </label>

  <label>Date
    <input type="date" name="date" value="{{ d.get('date', '') }}">
  </label>
</div>

<div class="box">
  <h3>Vehicle Information</h3>

  <label>Vehicle Make / Model
    <input type="text" name="vehicle_make_model" value="{{ d.get('vehicle_make_model', '') }}">
  </label>

  <label>License Plate Number
    <input type="text" name="license_plate" value="{{ d.get('license_plate', '') }}">
  </label>

  <label>Parking Location / Space
    <input type="text" name="parking_location" value="{{ d.get('parking_location', '') }}">
  </label>
</div>

<div class="box">
  <h3>Parking Rules</h3>

  <label><input type="checkbox" name="valid_registration" {% if d.get('valid_registration') %}checked{% endif %}> Vehicle must have current registration and insurance where required.</label>

  <label><input type="checkbox" name="approved_parking" {% if d.get('approved_parking') %}checked{% endif %}> Vehicle may only be parked in approved areas.</label>

  <label><input type="checkbox" name="no_blocking" {% if d.get('no_blocking') %}checked{% endif %}> Vehicle may not block driveways, exits, sidewalks, or emergency access.</label>

  <label><input type="checkbox" name="no_repairs" {% if d.get('no_repairs') %}checked{% endif %}> Major vehicle repairs are not permitted on the property.</label>

  <label><input type="checkbox" name="removal_ack" {% if d.get('removal_ack') %}checked{% endif %}> Unauthorized, unsafe, abandoned, or inoperable vehicles may be subject to removal according to property rules and applicable law.</label>
</div>

<div class="box">
  <h3>Acknowledgment</h3>

  <label>Participant Signature
    <input type="text" name="participant_signature" value="{{ d.get('participant_signature') or participant.get('name', '') }}" required>
  </label>
</div>

<button class="button" type="submit">Save and Review</button>

</form>

</body>
</html>
