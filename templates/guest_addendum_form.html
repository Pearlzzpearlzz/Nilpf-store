<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>09 – Guest Addendum</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile_responsive.css') }}">

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f4f1ea;
  margin: 0;
  padding: 20px;
  line-height: 1.55;
}

.page {
  background: #fff;
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  padding: 35px;
  border: 1px solid #bbb;
}

h1, h2, .copyright {
  text-align: center;
}

h3 {
  margin-top: 28px;
  border-bottom: 1px solid #222;
  padding-bottom: 4px;
}

label {
  display: block;
  margin-top: 18px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  font-size: 16px;
}

button {
  margin-top: 25px;
  padding: 12px 18px;
  background: #111;
  color: #fff;
  border: 0;
  border-radius: 6px;
  font-weight: bold;
}

.footer {
  margin-top: 30px;
  font-size: 14px;
}

@media (max-width: 600px) {
  body { padding: 8px; }
  .page { padding: 18px; }
}
</style>
</head>

<body>
<div class="page">

{% include "guest_addendum_content.html" %}

<form method="POST" action="/guest-addendum/{{ id }}">

<label>Participant Name</label>
<input
  type="text"
  name="participant_name"
  value="{{ d.get('participant_name') or participant.get('name', '') }}"
  required
>

<label>Participant Signature</label>
<input
  type="text"
  name="participant_signature"
  value="{{ d.get('participant_signature') or participant.get('name', '') }}"
  required
>

<label>Date</label>
<input
  type="date"
  name="signature_date"
  value="{{ d.get('signature_date', '') }}"
>

<div class="footer">
<p>Single-Site License Granted to Purchaser. Unauthorized Reproduction, Distribution, or Derivative Use Prohibited.</p>
<p>Version 2.1 — Revised February 2026</p>
</div>

<button type="submit">Save and Review</button>

</form>
</div>
</body>
</html>
